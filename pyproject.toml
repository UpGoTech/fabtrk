[project]
name = "fabtrk"
authors = [
    { name = "UpGo Technologies", email = "info@upgotech.in"}
]
description = "Fabrication Tracking Software simplifies end-to-end fabrication management. It streamlines processes from material planning to dispatch, ensuring efficient tracking and control for both company workers and contractors."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
